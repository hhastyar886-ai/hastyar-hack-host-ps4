<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;

var fwVersion = isPS4 ? match[1] : "Unknown"; 
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    document.getElementById("msgs").innerHTML = "فایلەکە نەدۆزرایەوە! زانیارییەکانی وێبگەڕ پاکبکەرەوە و هۆستەکە دووبارە پاشەکەوت بکەرەوە...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("msgs").innerHTML = "تەنها بۆ پلەیستەیشن ٤ لە ڤێرژنی ٥.٠٥ تا ١٤.٠٠ دەبێت";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 6.72 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("msgs").innerHTML = 'ئەم ڤێرژنە پشتیوانی نەکراوە: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 6.72 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var targetNode = document.getElementById('msgs');
    if (!targetNode) return;

    var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            var text = targetNode.innerText.toUpperCase();
            if (text.includes("SUCCESS") || text.includes("DONE") || text.includes("LAUNCHED") || text.includes("LOADED") || text.includes("سەرکەوتوو")) {
                document.getElementById("main-container").style.display = "none";
                document.getElementById("status-success").style.display = "block";
                observer.disconnect();
            }
            else if (text.includes("FAILED") || text.includes("ERROR") || text.includes("NOT FOUND") || text.includes("کێشە")) {
                document.getElementById("main-container").style.display = "none";
                document.getElementById("status-failed").style.display = "block";
                observer.disconnect();
            }
        });
    });
    observer.observe(targetNode, { characterData: true, childList: true, subtree: true });
});
</script>
